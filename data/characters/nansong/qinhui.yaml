famous_quotes:
  - 莫须有三字，何以服天下！（《宋史·岳飞传》记韩世忠面诘桧语，“莫须有”者，盖言“恐未必无”之意，故世忠以为不可）
  - 青山有幸埋忠骨，白铁无辜铸佞臣。（杭州西湖岳飞墓前旧联；墓门有桧及王氏、万俟卨、张俊四铁人旁跪，自明以来即然，后毁而复铸）
