famous_quotes:
  - （世忠）以楼船数十绝江口，金人不得便，相持四十有八日；其妻梁氏以功封安国夫人。（《宋史·韩世忠传》记黄天荡之役之大意，宋世妇人以军功受国夫人之封，此为最著者）
  - 相公但进兵，梁氏与儿不足计。（建炎三年苗傅、刘正彦之变，世忠举兵勤王，逆党以世忠妻子为质，说者记梁氏传语之语如此；正史文简，此出后人所传，故但存其意）
