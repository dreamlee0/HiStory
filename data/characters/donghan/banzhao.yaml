famous_quotes:
  - 鄙人愚暗，受性不敏，蒙先君之余宠，赖母师之典训。（《女诫》自序，言其所以作书教诸女之意）
  - 兄固著《汉书》，其八表及《天文志》未及竟而卒，和帝诏昭就东观藏书阁踵而成之。（《后汉书·列女传》）
