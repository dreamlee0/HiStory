  - 至元二十三年程钜夫荐起
  - 世祖目为神仙中人
  - 历兵部郎中集贤直学士
  - 同知济南路总管府事
  - 仁宗时翰林学士承旨
  - 魏国公之封与谥文敏
  - 妻管道昇子赵雍
  - 楷法兼宗李北海褚遂良
  - 后世称欧颜柳赵四家
  - 洛神赋胆巴碑三门记诸迹
  - 与鲜于枢并名于北方
  - 兰亭诸本之鉴定
  - 鹊华秋色图为周密作
  - 秀石疏林图自题一绝
  - 红衣西域僧浴马人骑等图
  - 作画贵有古意之论
  - 书画本来同之说
  - 高丽日本争求其笔迹
  - 以王孙仕异代之清议

famous_quotes:
  - 作画贵有古意，若无古意，虽工无益。今人但知用笔纤细，傅色浓艳，便自谓能手，殊不知古意既亏，百病横生。（《松雪斋集》所载孟頫题画之语，其论画大旨具此）
  - 石如飞白木如籀，写竹还于八法通。若也有人能会此，方知书画本来同。（《秀石疏林图》自题一绝，世之所传“书画同源”之说，最截者无过此四句）
