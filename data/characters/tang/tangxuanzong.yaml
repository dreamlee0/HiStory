famous_quotes:
  - 忆昔开元全盛日，小邑犹藏万家室。（杜甫《忆昔》，咏玄宗开元之盛）
  - 渔阳鼙鼓动地来，惊破霓裳羽衣曲。（白居易《长恨歌》，咏天宝之变）
  - 一骑红尘妃子笑，无人知是荔枝来。（杜牧《过华清宫》，说天宝之奢）
