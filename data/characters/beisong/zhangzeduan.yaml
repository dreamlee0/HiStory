famous_quotes:
  - 择端字正道，东武人也。幼读书，游学于京师，后习绘事，本工其界画，尤嗜于舟车、市桥、郭径，别成一家。（《向氏评论图画记》之文，金张著题《清明上河图》引之；世之知择端者，几乎全赖此数语）
  - 《西湖争标图》、《清明上河图》选入神品，藏者宜宝之。（同上张著跋所引，宋元以来论两图之高下者，皆以此为始）
