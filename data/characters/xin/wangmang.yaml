famous_quotes:
  - 紫色蛙声，余分闰位，圣王之驱除云尔！（《汉书·王莽传》赞，论其以伪乱真、新室为闰位）
  - 周公恐惧流言日，王莽谦恭未篡时。（白居易《放言五首》其三，后人论莽前后之异）
