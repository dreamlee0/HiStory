  - 十六岁入泮与二十余试之蹉跌
  - 入吴长庆之幕随赴山东
  - 光绪五年之从至朝鲜
  - 与袁世凯同幕之往事
  - 光绪二十年甲午科之状元
  - 翰林院修撰与乞假南归
  - 遵张之洞刘坤龙之命筹纱厂
  - 大生纱厂之招商与股款
  - 大生之谓易之取义
  - 通州师范学校之立
  - 盲哑学校与女子师范
  - 南通博物苑之设
  - 垦牧公司之起于海门
  - 更俗社与俱乐部之教化
  - 预备立宪公会与三次请愿
  - 江苏咨议局之议长
  - 民国初之实业总长农商总长
  - 棉铁主义之议
  - 大生之债务与改组
  - 沪宁之间之水工与水利
  - 临终之遗训与身后之评

famous_quotes:
  - 大生之谓易。（《易·系辞》之文，大生纱厂之名所取；其自述命名之义如此）
  - 民智开则国强，民力厚则国富；二者起于学校，而成于实业。（张謇论变法之本，大意如是，见于其光绪季年之疏议）
