famous_quotes:
  - 拥昭立宣，光为师保，虽周公、阿衡，何以加此。然光不学亡术，闇于大理。（《汉书·霍光传》赞）
  - 宣帝始谒见高庙，大将军光从骖乘，上内严惮之，若有芒刺在背。（《汉书·霍光传》）
