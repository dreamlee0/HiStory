famous_quotes:
  - 军中闻将军令，不闻天子之诏。（《史记·绛侯周勃世家》记细柳军门都尉传将军之令）
  - 介胄之士不拜，请以军礼见。（《史记·绛侯周勃世家》）
  - 嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！（《史记》记文帝之叹）
  - 君侯纵不反地上，即欲反地下耳。（《史记》记廷尉吏之辞）
