famous_quotes:
  - 《春秋》大一统者，天地之常经，古今之通谊也。（《汉书·董仲舒传》载其对策）
  - 臣愚以为诸不在六艺之科、孔子之术者，皆绝其道，勿使并进。（《汉书·董仲舒传》；《武帝纪》赞所谓“推明孔氏，抑黜百家”即后世“罢黜百家，独尊儒术”之所本）
  - 正其谊不谋其利，明其道不计其功。（《汉书·董仲舒传》）
  - 琴瑟不调，甚者必解而更张之，乃可鼓也；为政而不行，甚者必变而更化之，乃可理也。（《汉书》对策）
