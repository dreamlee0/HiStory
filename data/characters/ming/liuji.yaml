famous_quotes:
  - 烨然玉质而金色也，剖之如有烟扑口鼻，视其中则干若败絮。（刘基《诚意伯文集·卖柑者言》，借卖柑者之口以刺元末佩虎符、坐高堂者；后世“金玉其外，败絮其中”之语即本于此）
  - 是大厦也，必得大木；今视其质，将挠败是畏，恐不胜其任。（《明史·刘基传》记其辞相位之语，盖自谓非宰相之器）
