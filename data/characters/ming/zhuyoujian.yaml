famous_quotes:
  - 朕凉德藐躬，上干天咎，然皆诸臣误朕。（崇祯临终衣带之诏，诸家纪载文有小异，此其大略；《甲申传信录》、《明季北略》所录亦各有出入）
  - 任贼碎割朕体，毋伤我百姓。（同上，其所以自处与处国人者，止此二语，故论者虽罪其失政，而未尝不哀其志）
