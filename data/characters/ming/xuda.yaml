famous_quotes:
  - 驱逐胡虏，恢复中华，立纲陈纪，救济斯民。（洪武元年北伐之檄，宋濂承诏为文；达以征虏大将军奉此行师，故明师入都之纪律，多本此数语）
  - 首令士卒守宫门，封府库图籍，市不易肆。（《明史·徐达传》记洪武元年克大都之令；论者以谓不杀掠、不取库藏，故北方之民遂安于明）
