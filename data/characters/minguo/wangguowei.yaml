famous_quotes:
  - 古今之成大事业大学问者，必经过三种之境界：“昨夜西风凋碧树，独上高楼，望尽天涯路”，此第一境也；“衣带渐宽终不悔，为伊消得人憔悴”，此第二境也；“众里寻他千百度，蓦然回首，那人却在灯火阑珊处”，此第三境也。（《人间词话》）
  - 有境界则自成高格。（《人间词话》论词之首条，谓五代北宋词所以独绝后世在此）
