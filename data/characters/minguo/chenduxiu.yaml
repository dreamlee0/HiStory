famous_quotes:
  - 只有这两位先生，可以救中国之黑暗：一位是德先生，一位是赛先生。（《新青年》本志罪案之答辩书，民国八年作；原文举民主、科学之译音以为名，此其大要）
  - 推倒雕琢的、阿谀的贵族文学，建设平易的、抒情的国民文学。（《文学革命论》三大主义之首条，民国六年作）
